name: CI

on:
  push:
    branches:
    - 'main'
    - '[0-9]+.[0-9]+.x'
    - 'feature/**'
  pull_request:
    branches:
      - 'main'
      - '[0-9]+.[0-9]+.x'
      - 'feature/**'
  schedule:
    - cron: '0 1 * * *' # nightly build

permissions:
  contents: read

env:
  # Mirrors PYTHON_DEFAULT in noxfile.py — the single version tests run on.
  PYTHON_DEFAULT: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Lint & format
      run: uv run nox -s lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Type check
      run: uv run nox -s typecheck

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Security scan
      run: uv run nox -s security

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        retention-days: 30

  integration-tests:
    name: redis ${{ matrix.redis-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per distinct server-side execution tier the SDK can take:
        #
        #   8.8 - rate limiting uses the atomic INCREX command (Redis 8.8+).
        #   7.4 - latest minor of the 7.x line and the SDK's documented server
        #         floor; rate limiting degrades to the atomic Lua EVAL script.
        redis-version: ["8.8", "7.4"]

    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Run integration tests with coverage
      run: uv run nox -s "tests_integration-${{ env.PYTHON_DEFAULT }}"
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.redis-version == '8.8'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: integration
        name: codecov-integration
        fail_ci_if_error: true

  unit-tests:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Run unit tests
      run: uv run nox -s "tests_unit-${{ matrix.python-version }}"

    # One canonical upload rather than 15
    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PYTHON_DEFAULT
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unit
        name: codecov-unit
        fail_ci_if_error: true

  streams:
    name: streams / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build pinned Redis 8.10.2
        run: |
          curl --fail --location --max-time 60 https://github.com/redis/redis/archive/refs/tags/8.10.2.tar.gz --output "$RUNNER_TEMP/redis.tar.gz"
          echo "541a374b753a8405683dd88560465791acc98cf09445ef10ec1bd286904273e8  $RUNNER_TEMP/redis.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/redis.tar.gz" -C "$RUNNER_TEMP"
          make -C "$RUNNER_TEMP/redis-8.10.2/src" -j2 BUILD_TLS=no MALLOC=libc redis-server redis-cli
      - name: Standalone and three-primary Cluster acceptance
        run: uv run nox -s "streams-${{ matrix.python-version }}"
        env:
          STREAMS_REDIS_SERVER: ${{ runner.temp }}/redis-8.10.2/src/redis-server
          STREAMS_TOPOLOGIES: standalone,cluster,enterprise
      - name: Installed wheel outside the checkout
        run: |
          uv build --wheel
          STREAM_WHEEL=$(find "$GITHUB_WORKSPACE/dist" -name '*.whl' -print -quit)
          STREAM_SMOKE_DIR=$(mktemp -d)
          cd "$STREAM_SMOKE_DIR"
          uv run --no-project --python "${{ matrix.python-version }}" --with "${STREAM_WHEEL}[streams]" --with httpx python -I "$GITHUB_WORKSPACE/scripts/check_streams_wheel.py" "$RUNNER_TEMP/redis-8.10.2/src/redis-server"
          if [ "${{ matrix.python-version }}" = "3.10" ]; then
            uv run --no-project --python 3.10 --with "${STREAM_WHEEL}[streams]" --with fastapi==0.135.0 --with redis==8.0.1 --with httpx python -I "$GITHUB_WORKSPACE/scripts/check_streams_wheel.py" "$RUNNER_TEMP/redis-8.10.2/src/redis-server"
            uv run --no-project --python 3.10 --with "$STREAM_WHEEL" --with fastapi==0.115.0 --with redis==8.0.1 python -I -c 'import redis_fastapi; from fastapi import FastAPI; redis_fastapi.FastAPIRedis(FastAPI()).caching()'
          fi
      - name: Upload streaming coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .nox/streams-3-12/coverage.xml
          flags: streams
          name: codecov-streams
          fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, unit-tests, integration-tests, streams]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Build package
      run: uv build --sdist --wheel

    - name: Check package
      run: |
        uv run --with twine twine check dist/*

    - name: Test package installation
      run: |
        uv venv test-env
        VIRTUAL_ENV=test-env uv pip install dist/*.whl

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-files
        path: dist/
        retention-days: 7
