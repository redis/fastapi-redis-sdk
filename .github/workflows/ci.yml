name: CI

on:
  push:
    branches:
    - 'main'
    - '[0-9].[0-9]'
  pull_request:
    branches:
      - 'main'
      - '[0-9].[0-9]'
  schedule:
    - cron: '0 1 * * *' # nightly build

permissions:
  contents: read

env:
  # Mirrors PYTHON_DEFAULT in noxfile.py — the single version tests run on.
  PYTHON_DEFAULT: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Lint & format
      run: uv run nox -s lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Type check
      run: uv run nox -s typecheck

  security:
    runs-on: ubuntu-latest
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Security scan
      run: uv run nox -s security

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-reports
        path: bandit-report.json
        retention-days: 30

  integration-tests:
    name: redis ${{ matrix.redis-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per distinct server-side execution tier the SDK can take:
        #
        #   8.8 - rate limiting uses the atomic INCREX command (Redis 8.8+).
        #   7.4 - latest minor of the 7.x line and the SDK's documented server
        #         floor; rate limiting degrades to the atomic Lua EVAL script.
        redis-version: ["8.8", "7.4"]

    services:
      redis:
        image: redis:${{ matrix.redis-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Run integration tests with coverage
      run: uv run nox -s "tests_integration-${{ env.PYTHON_DEFAULT }}"
      env:
        REDIS_HOST: localhost
        REDIS_PORT: 6379

    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.redis-version == '8.8'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: integration
        name: codecov-integration
        fail_ci_if_error: true

  unit-tests:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout the project
      uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Run unit tests
      run: uv run nox -s "tests_unit-${{ matrix.python-version }}"

    # One canonical upload rather than 15
    - name: Upload coverage reports
      uses: codecov/codecov-action@v7
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == env.PYTHON_DEFAULT
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unit
        name: codecov-unit
        fail_ci_if_error: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, unit-tests, integration-tests]
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@v2
      with:
        egress-policy: audit

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        version: "latest"

    - name: Build package
      run: uv build --sdist --wheel

    - name: Check package
      run: |
        uv run --with twine twine check dist/*

    - name: Test package installation
      run: |
        uv venv test-env
        VIRTUAL_ENV=test-env uv pip install dist/*.whl

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist-files
        path: dist/
        retention-days: 7
