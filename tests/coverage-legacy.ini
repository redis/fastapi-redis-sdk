# Legacy Redis 7.4/8.8 jobs cannot exercise the opt-in Redis 8.10 feature.
# Streaming has its own real-Redis matrix and 80% coverage gate in nox streams.
# The full-suite and unit coverage reports continue to include every module.
[run]
source = redis_fastapi
omit =
    */redis_fastapi/stream_backend.py
    */redis_fastapi/_stream_relay.py
    */redis_fastapi/streams.py

[report]
show_missing = True
